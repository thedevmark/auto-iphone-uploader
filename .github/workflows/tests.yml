name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      # pytest, not unittest: tests/conftest.py pins the time zone and stubs the phone-link wait.
      - run: python -m pytest tests -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_windows.ps1 -CheckOnly -NoChecklist
